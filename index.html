<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B4BCAF">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="釜山檢核表">
<title>釜山 5 天｜出國前檢核表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#B4BCAF;--card:#FFFFFF;--card2:#E9ECE6;--soft:#EEF0EB;--ink:#0E0F0C;--sub:#4B5247;
  --line:#D0D6CA;--edge:#6E776A;--acc:#E2FF6F;--sage:#5F6B5E;
  --blk:#0E0F0C;--onblk:#FFFFFF;--warnfg:#E2FF6F;--k:1;
  --stripe:repeating-linear-gradient(135deg,rgba(14,15,12,.16) 0 7px,rgba(14,15,12,.04) 7px 14px);
}
.dark{--ground:#121410;--card:#1E221B;--card2:#272C23;--soft:#2B3027;--ink:#F2F4EE;--sub:#B5BCAD;--line:#3A4035;--edge:#8C957F;--sage:#3D463B;
  --blk:#F2F4EE;--onblk:#0E0F0C;--warnfg:#0E0F0C;
  --stripe:repeating-linear-gradient(135deg,rgba(242,244,238,.22) 0 7px,rgba(242,244,238,.06) 7px 14px);}
.big{--k:1.18}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none!important;user-select:none!important;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
::selection{background:transparent;color:inherit}
input::selection,textarea::selection{background:var(--acc);color:#0E0F0C}
html{background:var(--ground)}
body{font-family:'Inter Tight','Noto Sans TC',system-ui,sans-serif;font-size:calc(15px*var(--k));line-height:1.5;color:var(--ink);background:var(--ground);min-height:100vh;-webkit-text-size-adjust:100%}
body,button,input,textarea,a,.card,.item,.pill{transition:background-color .2s,color .2s,border-color .2s,opacity .2s,transform .2s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:24px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 24px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:35%;background:#0E0F0C;display:grid;place-items:center;flex:none}
.brand b{display:block;font-weight:700;letter-spacing:.06em;font-size:calc(17px*var(--k));line-height:1.2}
.brand span{display:block;font-size:calc(12px*var(--k));letter-spacing:.2em;color:var(--sub)}
.tools{display:flex;gap:8px}
.ibtn{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:500;font-size:calc(14px*var(--k))}
.ibtn:hover{transform:translateY(-1px)}.ibtn:active{transform:scale(.97)}
.ibtn[aria-pressed=true]{background:var(--blk);color:var(--onblk);border-color:var(--blk)}

.seg{position:relative;display:flex;background:var(--card);border-radius:999px;padding:5px;touch-action:pan-y;min-height:52px}
.seg .thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n));border-radius:999px;background:var(--blk);transition:transform .55s cubic-bezier(.3,1.7,.5,1)}
.seg.drag .thumb{transition:none}
.seg.press .thumb{scale:.94}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;min-height:42px;border-radius:999px;font-weight:500;font-size:calc(14px*var(--k));text-align:center;white-space:nowrap;padding:0 4px}
.seg button[aria-selected=true]{color:var(--onblk)}
#tabs{flex:1 1 420px;max-width:640px}

.grid{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.card{background:var(--card);border-radius:32px;padding:24px;flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card.w2{flex:2 1 520px}.card.sm{flex:1 1 200px;justify-content:center;align-items:center}
.card h2{font-weight:400;font-size:calc(24px*var(--k));line-height:1.2;text-align:center}
.card.lime{background:var(--acc);color:#0E0F0C}
.card.sage{background:var(--sage);color:#fff}
.card.black{background:var(--blk);color:var(--onblk)}
.view{animation:in .25s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-weight:400;font-size:calc(40px*var(--k));letter-spacing:-.02em;line-height:1.08;text-align:center;margin:8px 0 8px}
.when{text-align:center;margin-bottom:20px}
.lab{font-size:calc(13px*var(--k));font-weight:700;letter-spacing:.08em;text-align:center}
.num{font-size:calc(48px*var(--k));line-height:1;text-align:center;font-weight:400;letter-spacing:-.02em}
.num small{font-size:.42em;margin-left:.2em;letter-spacing:0}
.center{text-align:center}
.sub{color:var(--sub);font-size:calc(13px*var(--k))}
.sage .sub,.black .sub{color:inherit;opacity:.85}

.bar{height:8px;border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:#0E0F0C;border-radius:999px;transition:width .3s}
.heroRow{display:flex;gap:10px;align-items:center}
.ghost{flex:1;min-width:0;min-height:48px;border-radius:999px;border:1px solid #0E0F0C;padding:6px 20px;text-align:center;display:grid;place-items:center;font-weight:500;color:#0E0F0C}
.ghost span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.go{width:48px;height:48px;border-radius:50%;background:#0E0F0C;color:#fff;display:grid;place-items:center;flex:none}
.go:hover,.btn:hover,.lk:hover,.big-lk:hover{transform:translateY(-1px)}
.go:active,.btn:active,.lk:active,.big-lk:active{transform:scale(.97)}

.btn{min-height:48px;min-width:132px;padding:0 22px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;text-align:center;display:inline-grid;place-items:center}
.btn.pri{background:var(--blk);color:var(--onblk);border-color:var(--blk)}
.black .btn.pri{background:var(--acc);color:#0E0F0C;border-color:var(--acc)}
.black .btn{background:transparent;color:inherit;border-color:currentColor}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{display:inline-grid;place-items:center;min-height:32px;padding:2px 14px;border-radius:999px;background:var(--soft);font-size:calc(13px*var(--k));font-weight:500;text-align:center;flex:none}
.pill.k{background:var(--blk);color:var(--warnfg)}
.pill.d{background:transparent;border:1px dashed var(--edge)}
.pill.l{background:var(--acc);color:#0E0F0C}
.pill.n{background:var(--blk);color:var(--onblk)}

/* 連結按鈕 */
.lk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--blk);color:var(--onblk);font-weight:500;font-size:calc(14px*var(--k));white-space:nowrap;flex:none}
.lk.lt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.big-lk{flex:1 1 110px;min-height:92px;border-radius:28px;background:var(--card2);padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:500}
.big-lk .ic{width:40px;height:40px;border-radius:50%;background:var(--blk);color:var(--onblk);display:grid;place-items:center}
.quick{display:flex;flex-wrap:wrap;gap:10px}

/* 清單 */
.rows{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:8px 12px 8px 8px;border-radius:28px;background:var(--card2)}
.item .main{flex:1 1 140px;display:flex;align-items:center;gap:12px;min-height:48px;text-align:left;border-radius:22px;padding:4px}
.item .main:active{transform:scale(.99)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500}
.tx i{display:block;font-style:normal;color:var(--sub);font-size:calc(13px*var(--k))}
.ck{width:32px;height:32px;border-radius:50%;border:2px dashed var(--edge);display:grid;place-items:center;flex:none;transition:background-color .2s,border-color .2s,transform .25s cubic-bezier(.3,1.7,.5,1)}
.ck svg{opacity:0;transition:opacity .2s}
.main[aria-pressed=true] .ck{background:var(--acc);border:2px solid var(--acc);transform:scale(1.06)}
.main[aria-pressed=true] .ck svg{opacity:1}
.main[aria-pressed=true] .tx b{color:var(--sub)}
.item.flash{box-shadow:0 0 0 2px var(--ink)}
.tags{display:flex;gap:6px;flex:none}
.grp{display:flex;align-items:center;justify-content:center;gap:10px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--card)}

/* 規定 */
.rule{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border-radius:28px;background:var(--card2);min-height:52px}
.mk{width:28px;height:28px;flex:none;display:grid;place-items:center}
.mk.ok{border-radius:50%;background:var(--blk);color:var(--onblk)}
.mk.no{border-radius:8px;background-image:var(--stripe);color:var(--ink)}
.mk.inf{border-radius:50%;border:2px solid var(--edge)}
.mk.inf::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}

.prog{height:22px;border-radius:999px;background-image:var(--stripe);overflow:hidden;flex:1;min-width:60px}
.prog i{display:block;height:100%;background:var(--blk);border-radius:999px;transition:width .3s}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--card2)}
.srow b{font-weight:500;min-width:4.2em;text-align:left}
.srow .pill{min-width:64px}
.srow:hover{transform:translateY(-1px)}

.days{display:flex;gap:8px;justify-content:center}
.day{flex:1 1 0;max-width:84px;min-height:84px;border-radius:999px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day b{font-weight:400;font-size:calc(22px*var(--k));line-height:1}
.day span{font-size:calc(12px*var(--k))}
.day[aria-selected=true]{background:var(--acc);color:#0E0F0C}
.meals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.kv{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end;padding:10px 12px 10px 20px;border-radius:28px;background:var(--card2);min-height:60px}
.kv>div:first-child{flex:1 1 96px;min-width:0}
.kv b{font-weight:500}

.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1 1 180px;min-height:48px;border-radius:999px;border:1px solid var(--edge);background:var(--card);padding:0 20px;text-align:center}
textarea{width:100%;min-height:120px;border-radius:24px;border:1px solid var(--edge);background:var(--card);padding:16px 20px;resize:vertical;line-height:1.6}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-bottom:20px}
.toolbar .seg{width:230px}
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.exp.open{grid-template-rows:1fr}
.exp>div{overflow:hidden;min-height:0}
.delta{font-size:calc(44px*var(--k));line-height:1;text-align:center}
.delta small{font-size:.42em;margin-left:.2em}
.empty{background-image:var(--stripe);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E2FF6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <div><b>釜山玩樂趣 5 天</b><span>PUS05261126D</span></div>
    </div>
    <div class="seg" id="tabs" role="tablist" aria-label="分頁"></div>
    <div class="tools">
      <button class="ibtn" id="tDark" aria-pressed="false" aria-label="深色模式"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="ibtn" id="tBig" aria-pressed="false" aria-label="大字模式">大字</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
const gmap=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const U={
  arrival:'https://www.e-arrivalcard.go.kr',keta:'https://www.k-eta.go.kr',
  dep:'https://web.taoyuan-airport.com/flight_depart',arr:'https://web.taoyuan-airport.com/flight_arrival',
  wx:'https://www.cwa.gov.tw/V8/C/W/world.html',bag:'https://www.airbusan.com/content/common/service/baggage/',
  batt:'https://www.airbusan.com/content/common/service/baggage/restriction',
  tax:'https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=248765',gtf:'https://web.gtfetrs.com/chulgukhang',
  meat:'https://www.aphia.gov.tw/ws.php?id=10726',plant:'https://www.aphia.gov.tw/ws.php?id=10733',customs:'https://web.customs.gov.tw',
  boca:'https://www.boca.gov.tw/cp-87-2121-7a5da-1.html',pus:'https://www.roc-taiwan.org/krpus/index.html',
  papago:'https://papago.naver.com',nmap:'https://map.naver.com',vk:'https://big5chinese.visitkorea.or.kr/cht/',
  h1:gmap('Crown Harbor Hotel Busan'),h2:gmap('Lotte Hotel & Resort Gimhae'),t2:gmap('桃園國際機場第二航廈')
};
const TABS=[['home','首頁'],['before','行前'],['pack','行李'],['depart','去程'],['korea','釜山'],['return','回程']];
/* todo: [id, 標題, 說明, [按鈕文字, 網址], 標籤]　rules: [ok|no|inf, 文字, 說明] */
const S={
before:{title:'出發前要辦的事',when:'現在 → 11/25',cards:[
 {h:'證件',todo:[
  ['b1','看護照效期：還有 6 個月以上','台灣護照免簽證，也不用辦 K-ETA'],
  ['b2','跟領隊確認電子入境卡有幫你填','團體由領隊統一填寫；要自己填的話網址結尾是 .go.kr',['官網',U.arrival]],
  ['b3','印護照影本，帶 2 張大頭照'],
  ['b4','外國護照：辦 K-ETA 或簽證','出發前 72 小時完成，另帶回程機票證明',['K-ETA 官網',U.keta],'外籍才要'],
  ['b5','役男：申請出境許可','','', '役男才要']]},
 {h:'保險與藥品',todo:[
  ['b6','買旅遊平安險＋海外醫療險'],
  ['b7','準備常備藥和快篩','腸胃藥、感冒藥、暈車藥、自己的慢性病藥'],
  ['b8','特殊藥物：帶醫師證明，先告訴業務','','', '有用藥才要']]},
 {h:'先告訴旅行社',todo:[
  ['b9','吃素或特殊餐','出發前 2 天（不含假日）'],
  ['b10','長者、孕婦、嬰幼兒、要單人房','出發前 3 個工作日，太晚可能加收費用'],
  ['b11','問領隊：託運到底幾公斤','行前資料寫 23 公斤，釜山航空官網一般票是 15 公斤',['官網規定',U.bag]]]},
 {h:'錢與網路',todo:[
  ['b12','換韓元，帶 VISA 或 JCB 信用卡'],
  ['b13','領贈品：韓國 SIM 卡、轉接插頭','每人各一，SIM 卡每天 1GB'],
  ['b14','出發前 2–3 天查釜山天氣','目前預報 13–16° / 6–9°',['查天氣',U.wx]]]}
]},
pack:{title:'我的行李',when:'出發前一晚',cards:[
 {h:'已經有的',todo:[
  ['p24','隨身包','上機只能帶這個，10 公斤內','',['隨身包']],
  ['p1','護照','','',['隨身包']],
  ['p2','錢包','韓元、信用卡','',['隨身包']],
  ['p3','大頭照','兩吋 8 張','',['隨身包']],
  ['p4','行充','線頭和孔貼膠帶','',['隨身包','夾鏈袋']],
  ['p25','藍芽耳機','有電池，帶上機','',['隨身包']],
  ['p5','充電器、手機充電線','','',['隨身包']],
  ['p6','水壺','過安檢前倒空','',['隨身包']],
  ['p7','刮鬍刀','電動的放隨身包，手動的改放行李箱','',['隨身包']],
  ['p26','行李箱','託運，抓 15 公斤內','',['行李箱']],
  ['p8','衣服','','',['行李箱']],
  ['p9','拖鞋','','',['行李箱']],
  ['p10','浴巾','','',['行李箱']],
  ['p11','牙刷','','',['行李箱']]]},
 {h:'還缺',todo:[
  ['p15','隨身液體','保養品、藥水，每瓶 100 毫升內','',['隨身包','夾鏈袋']],
  ['p16','牙膏','韓國飯店不提供','',['行李箱']],
  ['p17','洗髮精、沐浴乳','韓國飯店不提供','',['行李箱']],
  ['p18','保暖外套','17:00 到釜山就冷，穿著或帶上機','',['隨身包']],
  ['p19','常備藥','腸胃藥、感冒藥','',['隨身包']],
  ['p20','雨傘或輕便雨衣','','',['行李箱']],
  ['p21','夾鏈袋、一小段膠帶','','',['隨身包']],
  ['p22','衛生紙、濕紙巾','','',['隨身包']],
  ['p23','轉接插頭、SIM 卡','集合時跟領隊拿','',['隨身包']]]},
 {h:'規定',rules:[
  ['ok','行充只能手提','每人最多 2 顆'],
  ['no','手提液體超過 100 毫升'],
  ['no','水壺裝水過安檢']],link:['電池規定',U.batt]}
]},
depart:{title:'去程：桃園機場',when:'11/26（四）',cards:[
 {h:'照順序做',todo:[
  ['d0','8:30 前從新竹出門'],
  ['d1','出門前吃飽','早餐、午餐自理，飛機上沒有餐'],
  ['d2','10:55 到第二航廈 3 樓','釜山航空櫃台，當天看出境看板確認',['怎麼去',U.t2],'10:55'],
  ['d3','找領隊徐健誠報到','領隊幫忙辦登機和託運'],
  ['d4','安檢：拿出液體夾鏈袋'],
  ['d5','13:25 起飛，提早到登機門','BX 572',['查航班',U.dep]]]},
 {h:'飛機上',rules:[
  ['ok','行動電源放座位下方或隨身包'],
  ['no','使用行動電源'],
  ['no','用機上 USB 充電'],
  ['no','行動電源放頭頂行李艙'],
  ['inf','座位由航空公司排，不能選位'],
  ['inf','沒到機場會被罰','單程約 USD 120–500']]}
]},
korea:{title:'在釜山',when:'11/26 – 11/30',cards:[
 {h:'記得做',todo:[
  ['k1','購物滿 15,000 韓元：出示護照拿退稅單','找有 TAX FREE 標示的店',['退稅說明',U.tax]],
  ['k2','11/27、11/29 晚餐自己吃','身上留韓元'],
  ['k3','11/29 早上行李全部帶走','當晚換住樂天飯店',['新飯店地圖',U.h2],'換飯店'],
  ['k4','晚上外出先告訴領隊']]},
 {h:'飯店',rules:[

function seg(el,labels,idx,cb){
  el.style.setProperty('--n',labels.length);
  el.innerHTML='<span class="thumb"></span>'+labels.map((l,i)=>`<button role="tab" aria-selected="${i===idx}">${l}</button>`).join('');
  const th=el.firstChild,n=labels.length;let cur=idx,sx=0,drag=false,pos=idx,down=false;
  const put=(p,sq)=>th.style.transform=`translateX(${p*100}%)`+(sq?' scale(1.06,.9)':'');
  const set=(i,fire)=>{cur=i;put(i);[...el.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-selected',j===i));if(fire)cb(i)};
  put(idx);
  const at=x=>{const r=el.getBoundingClientRect();return(x-r.left-5)/((r.width-10)/n)};
  el.onpointerdown=e=>{down=true;drag=false;sx=e.clientX;el.classList.add('press');el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!down)return;if(!drag&&Math.abs(e.clientX-sx)<6)return;drag=true;el.classList.add('drag');
    let p=at(e.clientX)-.5,max=n-1;if(p<0)p=Math.max(p*.25,-.07*n);if(p>max)p=max+Math.min((p-max)*.25,.07*n);pos=p;put(p,true)};
  el.onpointerup=e=>{if(!down)return;down=false;el.classList.remove('press','drag');
    const i=drag?Math.round(Math.min(n-1,Math.max(0,pos))):Math.min(n-1,Math.max(0,Math.floor(at(e.clientX))));
    drag=false;if(i!==cur)set(i,true);else put(cur)};
  el.onpointercancel=()=>{down=false;el.classList.remove('press','drag');put(cur)};
  el.onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d&&cur+d>=0&&cur+d<n){set(cur+d,true);el.querySelectorAll('button')[cur].focus()}};
  return{set:i=>set(i,false)};
}

function applyTheme(){
  document.documentElement.classList.toggle('dark',!!st.dark);document.documentElement.classList.toggle('big',!!st.big);
  $('#tDark').setAttribute('aria-pressed',!!st.dark);$('#tBig').setAttribute('aria-pressed',!!st.big);
}
$('#tDark').onclick=()=>{st.dark=!st.dark;save();applyTheme()};
$('#tBig').onclick=()=>{st.big=!st.big;save();applyTheme()};
const fromHash=()=>{const h=location.hash.slice(1);return TABS.some(x=>x[0]===h)?h:'home'};
tab=fromHash();
const tabsCtl=seg($('#tabs'),TABS.map(x=>x[1]),TABS.findIndex(x=>x[0]===tab),i=>go(TABS[i][0]));
addEventListener('hashchange',()=>{const h=fromHash();if(h!==tab)go(h)});
applyTheme();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
